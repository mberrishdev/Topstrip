# Builds Topstrip.exe from the private Topstrip-source repo and creates a draft release here.
# Run it from the Actions tab ("Release" → "Run workflow") or:
#   gh workflow run release.yml -R mberrishdev/Topstrip -f version=v0.1.0
# Needs the SOURCE_REPO_TOKEN secret: a fine-grained token with read access to Topstrip-source's contents.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.1.0
        required: true
      ref:
        description: Topstrip-source branch, tag or commit to build
        required: true
        default: main

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check version format
        shell: pwsh
        run: |
          if ($env:VERSION -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            throw "Version must look like v1.2.3 or v1.2.3-beta.1, got '$env:VERSION'"
          }

      - uses: actions/checkout@v7
        with:
          path: release

      - uses: actions/checkout@v7
        with:
          repository: mberrishdev/Topstrip-source
          ref: ${{ inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build Topstrip.exe
        shell: pwsh
        run: |
          dotnet publish source/Topstrip.csproj -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:Version=$($env:VERSION.TrimStart('v')) -o out
          (Get-FileHash out/Topstrip.exe -Algorithm SHA256).Hash.ToLower() + "  Topstrip.exe" | Out-File out/Topstrip.exe.sha256 -Encoding ascii

      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:VERSION `
            out/Topstrip.exe out/Topstrip.exe.sha256 release/THIRD-PARTY-NOTICES.md `
            --repo ${{ github.repository }} --title "Topstrip $env:VERSION" --draft --generate-notes

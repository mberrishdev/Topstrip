name: Bug report
description: Something in Topstrip doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part of the bar?
      options:
        - Docking / layout
        - Workspaces
        - Clock
        - Tray
        - Bluetooth
        - Network
        - Audio
        - Battery / power
        - Menu
        - Themes
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Topstrip version
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type `winver`, press Enter.
      placeholder: Windows 11 24H2 (26100.2605)
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional, but they help a lot.
